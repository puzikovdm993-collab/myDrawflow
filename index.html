<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Builder - Drawflow</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🔧 Workflow Builder</h1>
            <div class="toolbar">
                <button id="btn-add-node" class="btn btn-primary">➕ Добавить узел</button>
                <button id="btn-save" class="btn btn-success">💾 Сохранить</button>
                <button id="btn-load" class="btn btn-info">📂 Загрузить</button>
                <button id="btn-clear" class="btn btn-danger">🗑️ Очистить</button>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <h3>Панель узлов</h3>
                <div class="node-types">
                    <div class="node-type" data-type="start">
                        <span class="node-icon">🚀</span>
                        <span class="node-label">Старт</span>
                    </div>
                    <div class="node-type" data-type="process">
                        <span class="node-icon">⚙️</span>
                        <span class="node-label">Процесс</span>
                    </div>
                    <div class="node-type" data-type="decision">
                        <span class="node-icon">❓</span>
                        <span class="node-label">Решение</span>
                    </div>
                    <div class="node-type" data-type="end">
                        <span class="node-icon">🏁</span>
                        <span class="node-label">Финиш</span>
                    </div>
                </div>
                
                <div class="properties-panel">
                    <h4>Свойства узла</h4>
                    <div id="properties-content">
                        <p class="hint">Выберите узел для редактирования свойств</p>
                    </div>
                </div>
            </aside>

            <div class="workflow-area">
                <div id="drawflow" class="drawflow-container"></div>
            </div>
        </main>
    </div>

    <!-- Modal for node creation -->
    <div id="node-modal" class="modal">
        <div class="modal-content">
            <h3>Добавить узел</h3>
            <form id="node-form">
                <div class="form-group">
                    <label for="node-title">Название:</label>
                    <input type="text" id="node-title" required>
                </div>
                <div class="form-group">
                    <label for="node-type">Тип:</label>
                    <select id="node-type">
                        <option value="start">Старт</option>
                        <option value="process">Процесс</option>
                        <option value="decision">Решение</option>
                        <option value="end">Финиш</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Создать</button>
                    <button type="button" id="close-modal" class="btn btn-secondary">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
